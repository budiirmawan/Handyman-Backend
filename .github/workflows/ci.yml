          tests/bast-foundation-part01.test.ts \
          tests/bast-legacy-compatibility-part03.test.ts \
          tests/bast-lifecycle-part02.test.ts \
          tests/branding.test.ts \
          tests/breakdown-bindings.test.ts \
          tests/building-assignments.test.ts \
