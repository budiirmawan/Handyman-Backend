name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asentra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: asentra_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      
      - name: Apply database migrations
        run: |
          set -euo pipefail
          npm run db:migrate

      - name: Identity / RBAC / Isolation regression tests
        run: |
          set -euo pipefail
          npx tsx --test --test-concurrency=1 \
          tests/credentials.test.ts \
          tests/sessions.test.ts \
          tests/mobile-auth-contract.test.ts \
          tests/rbac.test.ts \
          tests/roles.test.ts \
          tests/permissions.test.ts \
          tests/operational-permission-contract.test.ts \
          tests/data-isolation.test.ts \
          tests/workforce-reporting-isolation.test.ts
        env:
          LOG_LEVEL: error

      - name: Core operational regression tests
        run: |
          set -euo pipefail
          npx tsx --test --test-concurrency=1 \
          tests/work-orders.test.ts \
          tests/work-order-lifecycle.test.ts \
          tests/work-order-completion.test.ts \
          tests/work-order-verification.test.ts \
          tests/maintenance-bindings.test.ts \
          tests/checklist-administration.test.ts \
          tests/findings.test.ts \
          tests/finding-closure.test.ts \
          tests/finding-review-verification.test.ts \
          tests/cr-be-stab-01-verification-closure-chain.test.ts \
          tests/vendors.test.ts \
          tests/vendor-work.test.ts \
          tests/workforce-reporting.test.ts
        env:
          LOG_LEVEL: error

      - name: Remaining DB-backed regression tests
        run: |
          set -euo pipefail
          npx tsx --test --test-concurrency=1 \
          tests/areas.test.ts \
          tests/asset-certifications.test.ts \
          tests/asset-classification.test.ts \
          tests/asset-failures.test.ts \
          tests/asset-history.test.ts \
          tests/asset-identifiers.test.ts \
          tests/asset-lifecycle.test.ts \
          tests/asset-location.test.ts \
          tests/asset-warranties.test.ts \
          tests/assets.test.ts \
          tests/attendance.test.ts \
          tests/audit.test.ts \
          tests/basic-expenses.test.ts \
