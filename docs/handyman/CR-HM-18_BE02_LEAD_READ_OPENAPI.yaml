# CR-HM-18 BE02 — frozen OpenAPI contract, documentation-only.
# These paths are not runtime-registered in BE02. Do not merge into the
# published docs/api/openapi.yaml until an implementation registers them;
# that document's source-of-truth rule is registered routes only.
openapi: 3.0.3
info:
  title: CR-HM-18 BE02 — Handyman Lead Read Contract
  version: 0.1.0
  description: |
    FROZEN CONTRACT ONLY — not an available runtime API in BE02.

    The only paths described here are the two authenticated Mobile Lead reads.
    Authorization is server-side: current assignment → crew → current valid
    Lead → active worker context → workforce profile userId equals the session
    user, plus canAccessClient for the resolved scope Client. No
    tenant_company.read permission is required. Results contain only scopes
    currently assigned to the authenticated Lead; no unassigned browsing or
    claim operation exists.
servers:
  - url: /api/v1
    description: Versioned API base path
x-contract-status: frozen-not-runtime-registered

tags:
  - name: Handyman Lead Reads
    description: CR-HM-18 BE02 contract-only field reads for the current assigned Lead.

paths:
  /handyman/lead/assigned-scopes:
    get:
      operationId: listHandymanLeadAssignedScopes
      summary: List scopes currently assigned to the authenticated Lead
      description: |
        CR-HM-18 BE02 — contract only; no runtime route is registered yet.
        Returns only current ACTIVE CR-HM-04 assignments whose dynamically
        resolved valid current Lead userId equals the authenticated session
        user and whose scope Client passes canAccessClient. No caller-selected
        Client/provider/crew/worker/Lead/request filter is accepted. The list
        is not a browse or claim queue and contains no unassigned scope.

        `preferredWindow` is the CR-HM-05 customer preference only; it is not
        a confirmed appointment or a scheduled execution window. This route
        does not require or infer `tenant_company.read` and never returns
        commercial or Care-provenance fields.
      tags: [Handyman Lead Reads]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: 1-based page number; pagination is over the caller's current assigned scopes only.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Maximum number of current assigned scopes to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Current scopes assigned to the authenticated Lead; empty when none are assigned.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/HandymanLeadAssignedScopeCard'
                      meta:
                        $ref: '#/components/schemas/HandymanLeadPaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /handyman/lead/assigned-scopes/{executionScopeId}:
    get:
      operationId: getHandymanLeadAssignedScope
      summary: Read field-safe detail for one currently assigned scope
      description: |
        CR-HM-18 BE02 — contract only; no runtime route is registered yet.
        The exact scope is reauthorized on every request using the current
        ACTIVE assignment, current valid Lead identity, and canAccessClient.
        A missing scope and a scope not currently assigned to this Lead have
        the same 404 shape to avoid assignment enumeration. Failure of the
        Client-access check is forbidden.

        The response carries only a field-safe approved-work projection and
        current readiness. It excludes customer/Care identity, commercial
        amounts, private evidence, free-text authorization notes, and
        assignment/crew membership details. Scheduling readiness remains a
        preferred window, not a confirmed appointment.
      tags: [Handyman Lead Reads]
      security:
        - bearerAuth: []
      parameters:
        - name: executionScopeId
          in: path
          required: true
          description: Existing CR-HM-06 Execution Scope identifier.
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Field-safe detail for a scope currently assigned to this Lead.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/HandymanLeadAssignedScopeDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Authenticated Backend local-user session.
  headers:
    RequestId:
      description: Server-generated request correlation identifier.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid pagination input or scope identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid authenticated session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated user does not pass the required Client-access boundary.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Scope does not exist or is not currently assigned to this Lead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          description: Endpoint-specific response payload.
        meta:
          type: object
          description: Pagination/context metadata; empty for non-list operations.
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
              format: uuid
    Uuid:
      type: string
      format: uuid
    HandymanLeadPaginationMeta:
      type: object
      description: Total and page metadata count only scopes currently visible to the authenticated Lead.
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
          description: Zero when total is zero.
    HandymanLeadFieldLocation:
      type: object
      description: Display-only location labels for this assigned scope; no tenant or customer identity.
      required: [buildingLabel]
      properties:
        buildingLabel:
          type: string
          minLength: 1
          maxLength: 160
        floorLabel:
          type: string
          nullable: true
          maxLength: 160
        areaLabel:
          type: string
          nullable: true
          maxLength: 160
        roomLabel:
          type: string
          nullable: true
          maxLength: 160
        spaceLabel:
          type: string
          nullable: true
          maxLength: 160
    HandymanLeadPreferredWindow:
      type: object
      description: CR-HM-05 preference only; never a confirmed or scheduled execution slot.
      required: [preferredWindowStart, preferredWindowEnd, timezone]
      properties:
        preferredWindowStart:
          type: string
          format: date-time
        preferredWindowEnd:
          type: string
          format: date-time
        timezone:
          type: string
          description: Building-derived IANA timezone.
    HandymanLeadAssignedScopeCard:
      type: object
      description: Minimal card for one current Backend-recorded assignment to this Lead.
      required:
        [executionScopeId, assignmentId, assignmentStatus, scopeStatus,
         assignedAt, serviceLabel, location, preferredWindow]
      properties:
        executionScopeId:
          $ref: '#/components/schemas/Uuid'
        assignmentId:
          $ref: '#/components/schemas/Uuid'
        assignmentStatus:
          type: string
          enum: [ACTIVE]
        scopeStatus:
          type: string
          enum: [AUTHORIZED]
        assignedAt:
          type: string
          format: date-time
        serviceLabel:
          type: string
          minLength: 1
          maxLength: 200
          description: Backend catalogue label; no customer-provided request text.
        location:
          $ref: '#/components/schemas/HandymanLeadFieldLocation'
        preferredWindow:
          allOf:
            - $ref: '#/components/schemas/HandymanLeadPreferredWindow'
          nullable: true
    HandymanLeadWorkItem:
      type: object
      description: Approved field-work instruction; sanitized for field use and contains no quote or cost fields.
      required: [lineType, description, quantity, unitLabel]
      properties:
        lineType:
          type: string
          enum: [LABOR, MATERIAL]
        description:
          type: string
          minLength: 1
          maxLength: 500
          description: Field-safe approved work description; excludes personal/customer details.
        quantity:
          type: number
          minimum: 0
          exclusiveMinimum: true
        unitLabel:
          type: string
          minLength: 1
          maxLength: 80
    HandymanLeadSchedulingReadiness:
      type: object
      description: Current ACTIVE CR-HM-05 preferred-window fact, not a scheduled appointment.
      required: [status, preferredWindowStart, preferredWindowEnd, timezone]
      properties:
        status:
          type: string
          enum: [ACTIVE]
        preferredWindowStart:
          type: string
          format: date-time
        preferredWindowEnd:
          type: string
          format: date-time
        timezone:
          type: string
    HandymanLeadUnitAccessReadiness:
      type: object
      description: Current ACTIVE Handyman unit-access window; not arrival or presence proof.
      required: [status, accessWindowStart, accessWindowEnd]
      properties:
        status:
          type: string
          enum: [ACTIVE]
        accessWindowStart:
          type: string
          format: date-time
        accessWindowEnd:
          type: string
          format: date-time
    HandymanLeadPermitReadiness:
      type: object
      description: Current ACTIVE Handyman permit-readiness fact; not FM Permit-to-Work.
      required: [permitType, status, validFrom, validUntil]
      properties:
        permitType:
          type: string
          enum: [UNIT, BUILDING_COMMON_AREA]
        status:
          type: string
          enum: [ACTIVE]
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
    HandymanLeadCurrentReadiness:
      type: object
      description: Current readiness only; no superseded/history rows or free-text notes.
      required: [scheduling, unitAccess, permitReadiness]
      properties:
        scheduling:
          allOf:
            - $ref: '#/components/schemas/HandymanLeadSchedulingReadiness'
          nullable: true
        unitAccess:
          allOf:
            - $ref: '#/components/schemas/HandymanLeadUnitAccessReadiness'
          nullable: true
        permitReadiness:
          type: array
          items:
            $ref: '#/components/schemas/HandymanLeadPermitReadiness'
    HandymanLeadAssignedScopeDetail:
      type: object
      description: Exact current assigned scope; no tenant/customer identity, commercial amounts, or private evidence.
      required:
        [executionScopeId, assignmentId, assignmentStatus, scopeStatus,
         assignedAt, serviceLabel, location, workItems, readiness]
      properties:
        executionScopeId:
          $ref: '#/components/schemas/Uuid'
        assignmentId:
          $ref: '#/components/schemas/Uuid'
        assignmentStatus:
          type: string
          enum: [ACTIVE]
        scopeStatus:
          type: string
          enum: [AUTHORIZED]
        assignedAt:
          type: string
          format: date-time
        serviceLabel:
          type: string
          minLength: 1
          maxLength: 200
        location:
          $ref: '#/components/schemas/HandymanLeadFieldLocation'
        workItems:
          type: array
          items:
            $ref: '#/components/schemas/HandymanLeadWorkItem'
        readiness:
          $ref: '#/components/schemas/HandymanLeadCurrentReadiness'
