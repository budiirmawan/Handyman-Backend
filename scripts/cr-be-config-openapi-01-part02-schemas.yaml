          description: Optional free-text description, at most 512 characters.
        status: { $ref: "#/components/schemas/FindingClassificationStatus" }
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp.
        updatedAt:
          type: string
          format: date-time
          description: Last-update timestamp.
    CreateFindingClassificationRequest:
