      summary: Link (or create) the BE-08 Work Order of a maintenance binding
      description: >-
        BE-10G. Either links an existing `workOrderId` or asks the shared BE-08
        service to create one. PM field execution is then the published BE-08
        action set on that Work Order — this binding adds no second execution
        path. Requires `maintenance_binding.manage`.
