      tags: [Engineering]
      security: [{ bearerAuth: [] }]
      x-required-permission: shift_handover.manage
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/EngineeringShiftHandoverIdPath"
      responses:
        "200":
          description: Shift handover acknowledged.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EngineeringShiftHandover"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
