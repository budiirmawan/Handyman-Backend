      security: [{ bearerAuth: [] }]
      x-required-permission: shift_handover.manage
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/EngineeringShiftHandoverIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEngineeringShiftHandoverRequest"
      responses:
        "200":
          description: Updated shift handover.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EngineeringShiftHandover"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /engineering/shift-handovers/{id}/ready:
    post:
      operationId: markEngineeringShiftHandoverReady
      summary: Mark a shift handover READY
