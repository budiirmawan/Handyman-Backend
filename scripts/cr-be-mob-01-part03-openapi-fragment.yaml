      responses:
        "200":
          description: Shift handover marked READY.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EngineeringShiftHandover"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /engineering/shift-handovers/{id}/acknowledge:
    post:
      operationId: acknowledgeEngineeringShiftHandover
      summary: Acknowledge a shift handover
      description: >-
        BE-10J lifecycle transition READY → ACKNOWLEDGED, recording the
