  # --------------------------------------------------------------------
  # CR-BE-MOB-01 PART 03 — Engineering field / reading contract.
  #
  # Existing BE-10 routes published for mobile. Nothing new is introduced:
  # every binding is a join row over an existing authority. Executions are
  # BE-07 checklist executions / form instances, PM & corrective execution
  # is the published BE-08 Work Order action set, evidence is the published
  # BE-07 evidence API on the returned execution id, and finding workflow
  # stays on BE-09 keyed by findingId.
