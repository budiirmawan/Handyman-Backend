      security: [{ bearerAuth: [] }]
      x-required-permission: shift_handover.read
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/EngineeringShiftHandoverIdPath"
      responses:
        "200":
          description: Shift handover.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EngineeringShiftHandover"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateEngineeringShiftHandover
      summary: Update the summary of a shift handover
      description: >-
        BE-10J. Only the free-text `summary` is mutable, and only while the
