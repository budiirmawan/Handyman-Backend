      security: [{ bearerAuth: [] }]
      x-required-permission: maintenance_binding.manage
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/MaintenanceBindingIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkMaintenanceWorkOrderRequest"
      responses:
        "200":
          description: Maintenance binding with its linked Work Order.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MaintenanceBinding"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /engineering/findings:
    post:
      operationId: createEngineeringFinding
      summary: Report an Engineering finding (or link an existing BE-09 Finding)
      description: >-
        BE-10H. Records the Engineering context (Asset / Functional Location /
        `operationType` / source execution) for an authoritative BE-09 Finding.
        Supply `findingId` to link an existing Finding, or the create fields to
        have the shared BE-09 service create one. Classification, severity,
        assignment, state transitions, review, rework, closure and
        `availableActions` all remain on the published BE-09 operations, keyed
        by `findingId` (NOT by this link's `id`). Requires
        `engineering_finding.manage`.
      tags: [Engineering]
      security: [{ bearerAuth: [] }]
      x-required-permission: engineering_finding.manage
      x-building-scoped: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEngineeringFindingRequest"
      responses:
        "201":
          description: Engineering finding link + authoritative BE-09 Finding.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EngineeringFinding"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      operationId: listEngineeringFindings
      summary: List Engineering findings
      description: >-
        BE-10H read, constrained to the caller's accessible Buildings. Each row
        embeds the authoritative BE-09 Finding and its per-caller
        `availableActions`. Requires `engineering_finding.read`.
      tags: [Engineering]
      security: [{ bearerAuth: [] }]
      x-required-permission: engineering_finding.read
      x-building-scoped: true
      parameters:
        - name: buildingId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: assetId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: sourceType
          in: query
          required: false
          schema: { $ref: "#/components/schemas/FindingSourceType" }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/FindingStatus" }
      responses:
        "200":
          description: Engineering finding list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/EngineeringFinding"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /engineering/findings/{id}:
    get:
      operationId: getEngineeringFinding
      summary: Get an Engineering finding link by id
      description: >-
        BE-10H read. `{id}` is the Engineering link id; use the embedded
        `findingId` for every BE-09 workflow operation. Requires
        `engineering_finding.read`.
      tags: [Engineering]
      security: [{ bearerAuth: [] }]
      x-required-permission: engineering_finding.read
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/EngineeringFindingIdPath"
      responses:
        "200":
          description: Engineering finding.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EngineeringFinding"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /buildings/{buildingId}/engineering/daily-operations:
    get:
      operationId: getEngineeringDailyOperations
      summary: Daily Engineering operations read model for a Building
      description: >-
        BE-10A. A consolidated per-Building, per-operational-date (+ optional
        Shift) view of BE-07 generated Tasks, BE-08 Work Orders and BE-09
        Findings. Every row references its authoritative source id and carries
        the source domain's own status, untranslated; `availableActions` is
        present for FINDING rows only, because Tasks and Work Orders expose no
        authoritative available-actions service. Nothing is copied into a new
        master table. `date` is REQUIRED. Requires `engineering.read` and
        BE-02G Building access.
      tags: [Engineering]
      security: [{ bearerAuth: [] }]
      x-required-permission: engineering.read
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/BuildingIdPath"
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
          description: Operational date YYYY-MM-DD (required).
        - name: shiftId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: Daily Engineering operations.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EngineeringDailyOperations"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /buildings/{buildingId}/engineering/overview:
    get:
      operationId: getEngineeringOverview
      summary: Engineering supervisor overview for a Building
      description: >-
        BE-10K. A concise supervisor read model composed from the BE-10A daily
        operations, BE-09 finding counts, BE-08 active Work Orders and the
        BE-10J handover dataset. Derived at read time — no analytics engine and
        no duplicated operational data. `date` defaults to today. Requires
        `engineering_overview.read` and BE-02G Building access.
      tags: [Engineering]
      security: [{ bearerAuth: [] }]
      x-required-permission: engineering_overview.read
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/BuildingIdPath"
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: shiftId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: Engineering overview.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EngineeringOverview"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /buildings/{buildingId}/engineering/shift-handovers:
    post:
      operationId: createEngineeringShiftHandover
      summary: Create an Engineering shift handover
      description: >-
        BE-10J. Links an outgoing and an incoming BE-03 Shift for one Building
        and date, with a DRAFT → READY → ACKNOWLEDGED lifecycle. The
        operational `dataset` is resolved live from the authoritative
        Engineering records at read time and is never copied into the handover
        row. Requires `shift_handover.manage` and BE-02G Building access.
      tags: [Engineering]
      security: [{ bearerAuth: [] }]
      x-required-permission: shift_handover.manage
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/BuildingIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEngineeringShiftHandoverRequest"
      responses:
        "201":
          description: Shift handover created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EngineeringShiftHandover"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      operationId: listEngineeringShiftHandovers
      summary: List Engineering shift handovers for a Building
      description: >-
        BE-10J read, optionally filtered by handover date. Requires
        `shift_handover.read` and BE-02G Building access.
      tags: [Engineering]
      security: [{ bearerAuth: [] }]
      x-required-permission: shift_handover.read
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/BuildingIdPath"
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Shift handover list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/EngineeringShiftHandover"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /engineering/shift-handovers/{id}:
    get:
      operationId: getEngineeringShiftHandover
      summary: Get an Engineering shift handover by id
      description: >-
