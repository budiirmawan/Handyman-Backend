        - $ref: "#/components/parameters/AssetIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInspectionBindingRequest"
      responses:
        "201":
          description: Inspection binding created.
          content:
            application/json:
              schema:
                allOf:
