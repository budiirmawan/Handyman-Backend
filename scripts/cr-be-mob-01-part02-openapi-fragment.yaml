  /operational-incidents/{id}:
    get:
      operationId: getOperationalIncident
      summary: Get an Operational Incident by id
      description: >-
        BE-21B read. `id` is the shared BE-21A Incident id;
        `operationalIncidentId` is the internal specialization id.
        `availableActions` is backend-resolved per request from state ×
        permission × foundation lifecycle and must never be recomputed by
        the client. Requires `operational_incident.read`.
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: operational_incident.read
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/OperationalIncidentIdPath"
      responses:
        "200":
          description: Operational Incident.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OperationalIncident"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateOperationalIncident
      summary: Update an Operational Incident (incl. handling status)
      description: >-
        BE-21B. Foundation metadata and operational fields are accepted on
        one request and applied atomically. `operationalStatus` follows the
        closed transition table (OPEN → IN_PROGRESS|RESOLVED, IN_PROGRESS →
        RESOLVED|OPEN, RESOLVED → IN_PROGRESS); an illegal transition is
        rejected. `RESOLVED` means operational handling finished — NOT
        verified or closed. Requires `operational_incident.manage`.
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: operational_incident.manage
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/OperationalIncidentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOperationalIncidentRequest"
      responses:
        "200":
          description: Updated Operational Incident.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OperationalIncident"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
