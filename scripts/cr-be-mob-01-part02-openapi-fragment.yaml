  # --------------------------------------------------------------------
  # CR-BE-MOB-01 PART 02 — Security operational contract.
  #
  # Existing BE-12 (Security) and BE-21A/B (Incident) routes published for
  # mobile. Nothing new is introduced: patrol execution start/complete
  # delegate to the BE-07 task engine, patrol checklist execution stays on
  # BE-07 checklist endpoints, and finding workflow stays on BE-09.
  # --------------------------------------------------------------------

  /buildings/{buildingId}/security-posts:
    post:
      operationId: createSecurityPost
      summary: Create a Security Post in a Building
      description: >-
        BE-12A. A Security Post is Security operational context anchored to
        the BE-04 building structure (Floor / Area / Room / Space /
        Functional Location references only — never a second hierarchy).
        Requires `security_post.manage` and BE-02G Building access.
        `clientId` is derived through Building → Property → Client and is
        never accepted from the caller.
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: security_post.manage
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/BuildingIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSecurityPostRequest" }
      responses:
        "201":
          description: Security Post created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SecurityPost" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      operationId: listBuildingSecurityPosts
      summary: List Security Posts in a Building
      description: >-
        BE-12A read. Requires `security_post.read` and BE-02G Building
        access. Mobile relevance: duty-post picker and patrol start-post
        context.
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: security_post.read
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/BuildingIdPath"
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/SecurityPostStatus" }
        - name: postType
          in: query
          required: false
          schema: { $ref: "#/components/schemas/SecurityPostType" }
        - name: floorId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: areaId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: roomId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: spaceId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: functionalLocationId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: Security Post list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SecurityPost" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /security/posts/{id}:
    get:
      operationId: getSecurityPost
      summary: Get a Security Post by id
      description: >-
        BE-12A read. Requires `security_post.read`; the service walks
        Security Post → Building and asserts BE-02G access, so an
        inaccessible post is rejected with 403 `BUILDING_ACCESS_DENIED`.
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: security_post.read
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/SecurityPostIdPath"
      responses:
        "200":
          description: Security Post.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SecurityPost" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateSecurityPost
      summary: Update a Security Post
      description: >-
        BE-12A. Requires `security_post.manage` and Building access.
        `code`, `clientId` and `buildingId` are immutable.
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: security_post.manage
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/SecurityPostIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSecurityPostRequest" }
      responses:
        "200":
          description: Updated Security Post.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SecurityPost" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /buildings/{buildingId}/security/patrol-routes:
    post:
      operationId: createPatrolRoute
      summary: Create a Patrol Route in a Building
      description: >-
        BE-12B. A Patrol Route is the ordered patrol definition for one
        Building, optionally starting at a BE-12A Security Post in the same
        Building. It carries no schedule, task, or execution semantics.
        Requires `patrol_route.manage` and BE-02G Building access.
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: patrol_route.manage
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/BuildingIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePatrolRouteRequest" }
      responses:
        "201":
          description: Patrol Route created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PatrolRoute" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      operationId: listBuildingPatrolRoutes
      summary: List Patrol Routes in a Building
      description: >-
        BE-12B read. Requires `patrol_route.read` and BE-02G Building
        access. Mobile relevance: route picker and checkpoint context.
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: patrol_route.read
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/BuildingIdPath"
      responses:
        "200":
          description: Patrol Route list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PatrolRoute" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /security/patrol-routes/{id}:
    get:
      operationId: getPatrolRoute
      summary: Get a Patrol Route by id
      description: >-
        BE-12B read. Requires `patrol_route.read`; Building access is
        asserted through Patrol Route → Building.
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: patrol_route.read
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/PatrolRouteIdPath"
      responses:
        "200":
          description: Patrol Route.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PatrolRoute" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updatePatrolRoute
      summary: Update a Patrol Route
      description: >-
        BE-12B. Requires `patrol_route.manage`. `code`, `clientId` and
        `buildingId` are immutable; a start post must belong to the same
        Building (`PATROL_ROUTE_START_POST_MISMATCH`).
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: patrol_route.manage
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/PatrolRouteIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePatrolRouteRequest" }
      responses:
        "200":
          description: Updated Patrol Route.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PatrolRoute" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /security/patrol-routes/{id}/points:
    post:
      operationId: addPatrolRoutePoint
      summary: Add a checkpoint (patrol route point) to a Patrol Route
      description: >-
        BE-12B. A patrol route point IS the Security checkpoint: an ordered
        (`sequence`) reference to an existing BE-04 location (Floor / Area /
        Room / Space / Functional Location). There is no separate checkpoint
        master and no checkpoint identifier/QR authority — scan-to-confirm
        remains unavailable (see the QR boundary in CR-BE-MOB-01 PART 05).
        Requires `patrol_route.manage`; duplicate sequences are rejected with
        `PATROL_ROUTE_POINT_DUPLICATE_SEQUENCE`.
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: patrol_route.manage
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/PatrolRouteIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatrolRoutePointRequest"
      responses:
        "201":
          description: Checkpoint added.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PatrolRoutePoint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      operationId: listPatrolRoutePoints
      summary: List the checkpoints of a Patrol Route
      description: >-
        BE-12B read, ordered by `sequence`. Requires `patrol_route.read`.
        Mobile relevance: the checkpoint list a guard must confirm during a
        patrol execution.
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: patrol_route.read
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/PatrolRouteIdPath"
      responses:
        "200":
          description: Checkpoint list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PatrolRoutePoint"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /security/patrol-route-points/{id}:
    patch:
      operationId: updatePatrolRoutePoint
      summary: Update a checkpoint (patrol route point)
      description: >-
        BE-12B. Requires `patrol_route.manage`. The point stays inside its
        route's Building (`PATROL_ROUTE_POINT_LOCATION_MISMATCH`).
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: patrol_route.manage
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/PatrolRoutePointIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatrolRoutePointRequest"
      responses:
        "200":
          description: Updated checkpoint.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PatrolRoutePoint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /security/patrol-routes/{id}/schedule-bindings:
    post:
      operationId: createPatrolScheduleBinding
      summary: Bind a Patrol Route to a BE-07 Schedule Definition
      description: >-
        BE-12C. The binding is the patrol *assignment of work over time*:
        it links a Patrol Route to a shared BE-07 Schedule Definition, which
        generates the tasks that become Patrol Executions. Recurrence,
        occurrence preview and task generation stay in BE-07 — this module
        never re-implements them. Assignment of a generated patrol to a
        workforce profile or team is the published BE-07 task assignment
        surface (`POST /tasks/{taskId}/assignments`), where `taskId` is the
        Patrol Execution id. Requires `patrol_schedule.manage`.
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: patrol_schedule.manage
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/PatrolRouteIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatrolScheduleBindingRequest"
      responses:
        "201":
          description: Patrol Schedule Binding created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PatrolScheduleBinding"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      operationId: listPatrolRouteScheduleBindings
      summary: List the Schedule Bindings of a Patrol Route
      description: >-
        BE-12C read. Requires `patrol_schedule.read`. Each row resolves the
        BE-07 schedule and recurrence context without copying it.
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: patrol_schedule.read
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/PatrolRouteIdPath"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PatrolScheduleBindingStatus"
        - name: buildingId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: patrolRouteId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: scheduleDefinitionId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: Patrol Schedule Binding list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PatrolScheduleBinding"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /security/patrol-schedule-bindings/{id}:
    get:
      operationId: getPatrolScheduleBinding
      summary: Get a Patrol Schedule Binding by id
      description: >-
        BE-12C read. Requires `patrol_schedule.read`; Building access is
        asserted through the binding's Building.
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: patrol_schedule.read
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/PatrolScheduleBindingIdPath"
      responses:
        "200":
          description: Patrol Schedule Binding.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PatrolScheduleBinding"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updatePatrolScheduleBinding
      summary: Update a Patrol Schedule Binding
      description: >-
        BE-12C. Requires `patrol_schedule.manage`. Only the Security-side
        binding fields are mutable; the BE-07 Schedule Definition is edited
        through BE-07.
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: patrol_schedule.manage
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/PatrolScheduleBindingIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatrolScheduleBindingRequest"
      responses:
        "200":
          description: Updated Patrol Schedule Binding.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PatrolScheduleBinding"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /buildings/{buildingId}/security/patrol-executions:
    get:
      operationId: listBuildingPatrolExecutions
      summary: List Patrol Executions for a Building
      description: >-
        BE-12D read. A Patrol Execution is the Security view of an
        authoritative BE-07 generated task bound to a Patrol Route through a
        BE-12C Schedule Binding; `id` equals the BE-07 `taskId` and `status`
        is the shared task status (no second lifecycle). Requires
        `patrol_execution.read` and BE-02G Building access. Mobile
        relevance: the guard's patrol work list.
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: patrol_execution.read
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/BuildingIdPath"
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: Operational date YYYY-MM-DD.
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/PatrolExecutionStatus" }
        - name: patrolRouteId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: Patrol Execution list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PatrolExecution"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /security/patrol-executions/{id}:
    get:
      operationId: getPatrolExecution
      summary: Get a Patrol Execution by id
      description: >-
        BE-12D read. `id` is the BE-07 task id. `pointProgress` is derived
        from `patrol_point_visits` versus the route's ACTIVE checkpoints and
        is backend-authoritative. Requires `patrol_execution.read`.
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: patrol_execution.read
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/PatrolExecutionIdPath"
      responses:
        "200":
          description: Patrol Execution.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PatrolExecution" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /security/patrol-executions/{id}/start:
    post:
      operationId: startPatrolExecution
      summary: Start a Patrol Execution
      description: >-
        BE-12D. Delegates to the shared BE-07 task-execution engine, which
        owns the transition (`OPEN|ASSIGNED → IN_PROGRESS`) and rejects an
        illegal one. Prefer this over the generic `startTask` on a patrol so
        the Security route/binding checks run. Requires
        `patrol_execution.manage`.
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: patrol_execution.manage
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/PatrolExecutionIdPath"
      responses:
        "200":
          description: Started Patrol Execution.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PatrolExecution" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /security/patrol-executions/{id}/points/{pointId}/visit:
    post:
      operationId: recordPatrolPointVisit
      summary: Confirm a checkpoint during a Patrol Execution
      description: >-
        BE-12D. Records a `patrol_point_visits` row (`VISITED`) for the
        checkpoint `pointId` of the execution's route. This is the
        checkpoint-confirmation authority; confirmation is by canonical
        `pointId`, NOT by QR scan (no checkpoint identifier authority
        exists). Requires `patrol_execution.manage`; the execution must be
        IN_PROGRESS and the point must belong to the execution's route.
      tags: [Security]
      security: [{ bearerAuth: [] }]
      x-required-permission: patrol_execution.manage
      x-building-scoped: true
      parameters:
        - $ref: "#/components/parameters/PatrolExecutionIdPath"
        - $ref: "#/components/parameters/PatrolPointIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPatrolPointVisitRequest"
      responses:
        "201":
          description: Checkpoint visit recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PatrolPointVisit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /security/patrol-executions/{id}/points:
    get:
      operationId: listPatrolPointVisits
      summary: List checkpoint visits of a Patrol Execution
