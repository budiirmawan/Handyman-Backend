  /housekeeping/findings:
    get:
      operationId: listHousekeepingFindings
      summary: List housekeeping finding bindings
      description: >-
        BE-11H links HK sources to a BE-09 Finding. Lifecycle/rework stay on
        published finding operations using `findingId`. Requires
        `housekeeping_finding.read`. Pass `buildingId` for scoped lists.
      tags: [Housekeeping]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: buildingId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: cleaningAreaId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: sourceType
          in: query
          required: false
          schema: { $ref: "#/components/schemas/HousekeepingFindingSourceType" }
        - name: status
          in: query
          required: false
          schema: { type: string }
          description: Finding status filter (BE-09 status).
      responses:
        "200":
          description: Housekeeping finding list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/HousekeepingFinding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createHousekeepingFinding
      summary: Create a housekeeping finding (BE-09 Finding + HK link)
      description: >-
        Requires `housekeeping_finding.manage` and Building access.
        Creates an authoritative BE-09 Finding and the HK source binding.
        Rework uses `requestFindingRework` / `resubmitFinding` on `findingId`.
      tags: [Housekeeping]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateHousekeepingFindingRequest" }
      responses:
        "201":
