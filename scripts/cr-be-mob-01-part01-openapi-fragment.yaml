  # --------------------------------------------------------------------
  # CR-BE-MOB-01 PART 01 — Housekeeping operational contract.
  # Existing BE-11 routes published for mobile. Execution writes stay on
  # BE-07 task/checklist endpoints; rework stays on BE-09 findings.
  # --------------------------------------------------------------------
  /buildings/{buildingId}/housekeeping/daily-cleaning:
    get:
      operationId: listBuildingDailyCleaning
      summary: List daily cleaning tasks for a Building
      description: >-
        BE-11C read view of BE-07 generated tasks bound to a Cleaning Area.
        Requires `daily_cleaning.read` and BE-02G Building access.
        Execution writes are `startTask` / `completeTask` / `cancelTask`
        using `taskId` (same as `id`). Mobile relevance: cleaning work list.
      tags: [Housekeeping]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/BuildingIdPath"
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: Operational date YYYY-MM-DD.
        - name: cleaningAreaId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/DailyCleaningStatus" }
      responses:
        "200":
          description: Daily cleaning list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/DailyCleaning" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /housekeeping/daily-cleaning/{id}:
    get:
      operationId: getDailyCleaning
      summary: Get a daily cleaning task by id
      description: >-
        Authoritative daily-cleaning read. `id` is the BE-07 generated task
        id (`taskId`). Requires `daily_cleaning.read` and Building access
        on the task's Building.
      tags: [Housekeeping]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DailyCleaningIdPath"
      responses:
        "200":
          description: Daily cleaning record.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DailyCleaning" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

