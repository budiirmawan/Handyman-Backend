    # ------------------------------------------------------------------
    # CR-BE-MOB-01 PART 01 — Housekeeping operational schemas (BE-11).
    # ------------------------------------------------------------------
    DailyCleaningStatus:
      type: string
      enum: [OPEN, ASSIGNED, IN_PROGRESS, COMPLETED, CANCELLED]
      description: BE-07 generated-task status projected as daily cleaning.
    DailyCleaning:
      type: object
      description: >-
        BE-11C operational view of a BE-07 generated task. `id` equals
        `taskId` and is the authoritative id for start/complete/cancel.
      required:
        [id, taskId, clientId, buildingId, cleaningAreaId, scheduleBindingId,
         scheduleDefinitionId, operationalDate, occurrenceAt, status,
         startedAt, completedAt, completedByUserId, completionNotes,
         cleaningArea, schedule, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        taskId: { $ref: "#/components/schemas/Uuid" }
        clientId: { $ref: "#/components/schemas/Uuid" }
        buildingId: { $ref: "#/components/schemas/Uuid" }
        cleaningAreaId: { $ref: "#/components/schemas/Uuid" }
        scheduleBindingId: { $ref: "#/components/schemas/Uuid" }
        scheduleDefinitionId: { $ref: "#/components/schemas/Uuid" }
        operationalDate: { type: string, format: date }
        occurrenceAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/DailyCleaningStatus" }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        completedByUserId:
          allOf: [{ $ref: "#/components/schemas/Uuid" }]
          nullable: true
        completionNotes: { type: string, nullable: true }
        cleaningArea:
          type: object
          required: [id, code, name, cleaningAreaType, status]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            code: { type: string }
            name: { type: string }
            cleaningAreaType: { type: string }
            status: { type: string }
            floorId: { type: string, format: uuid, nullable: true }
            areaId: { type: string, format: uuid, nullable: true }
            roomId: { type: string, format: uuid, nullable: true }
            spaceId: { type: string, format: uuid, nullable: true }
            functionalLocationId: { type: string, format: uuid, nullable: true }
        schedule:
          type: object
          required: [id, code, name, targetType, targetId, status]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            code: { type: string }
            name: { type: string }
            targetType: { type: string }
            targetId: { $ref: "#/components/schemas/Uuid" }
            status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CleaningAssignmentStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    CleaningAssignment:
      type: object
      required:
        [id, taskId, assigneeType, workforceProfileId, teamId,
         assignedByUserId, assignedAt, status, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        taskId: { $ref: "#/components/schemas/Uuid" }
        assigneeType: { type: string, enum: [WORKFORCE, TEAM] }
        workforceProfileId:
          allOf: [{ $ref: "#/components/schemas/Uuid" }]
          nullable: true
        teamId:
          allOf: [{ $ref: "#/components/schemas/Uuid" }]
          nullable: true
        assignedByUserId: { $ref: "#/components/schemas/Uuid" }
        assignedAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/CleaningAssignmentStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        assignee:
          type: object
          nullable: true
          properties:
            type: { type: string, enum: [WORKFORCE, TEAM] }
            id: { $ref: "#/components/schemas/Uuid" }
            code: { type: string }
            name: { type: string }
    CreateCleaningAssignmentRequest:
      type: object
      required: [assigneeType]
      properties:
        assigneeType: { type: string, enum: [WORKFORCE, TEAM] }
        workforceProfileId:
          type: string
          format: uuid
          description: Required when assigneeType is WORKFORCE.
        teamId:
          type: string
          format: uuid
          description: Required when assigneeType is TEAM.

    HousekeepingBindingStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    ToiletInspectionBinding:
