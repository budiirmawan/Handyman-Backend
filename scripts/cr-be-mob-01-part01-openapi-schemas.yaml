        status: { type: string }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ToiletInspectionExecutionContext:
      type: object
      required: [execution, toiletInspectionBinding]
      properties:
        execution: { $ref: "#/components/schemas/ToiletInspectionExecution" }
        toiletInspectionBinding: { $ref: "#/components/schemas/ToiletInspectionBinding" }

