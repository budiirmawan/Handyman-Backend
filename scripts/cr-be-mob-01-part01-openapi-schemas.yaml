    SupervisorInspection:
      type: object
      required:
        [id, clientId, buildingId, cleaningAreaId, targetType, targetId,
         reviewId, supervisorUserId, decision, status, notes, inspectedAt,
         createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        clientId: { $ref: "#/components/schemas/Uuid" }
        buildingId: { $ref: "#/components/schemas/Uuid" }
        cleaningAreaId: { $ref: "#/components/schemas/Uuid" }
        targetType: { $ref: "#/components/schemas/SupervisorInspectionTargetType" }
        targetId: { $ref: "#/components/schemas/Uuid" }
        reviewId:
          allOf: [{ $ref: "#/components/schemas/Uuid" }]
          nullable: true
        supervisorUserId: { $ref: "#/components/schemas/Uuid" }
        decision:
          allOf: [{ $ref: "#/components/schemas/SupervisorInspectionDecision" }]
          nullable: true
        status: { $ref: "#/components/schemas/SupervisorInspectionStatus" }
        notes: { type: string, nullable: true }
        inspectedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        cleaningArea:
          type: object
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            code: { type: string }
            name: { type: string }
            cleaningAreaType: { type: string }
            status: { type: string }
        targetSummary:
          type: object
          nullable: true
