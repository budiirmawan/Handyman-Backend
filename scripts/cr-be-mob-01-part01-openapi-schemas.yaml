      type: object
      required: [targetType, targetId]
      properties:
        targetType: { $ref: "#/components/schemas/SupervisorInspectionTargetType" }
        targetId: { $ref: "#/components/schemas/Uuid" }
        notes: { type: string, maxLength: 1000, nullable: true }
    SubmitSupervisorInspectionDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { $ref: "#/components/schemas/SupervisorInspectionDecision" }
        notes: { type: string, maxLength: 1000, nullable: true }

    QualityAuditSourceType:
      type: string
      enum: [DAILY_CLEANING, TOILET_INSPECTION, PUBLIC_AREA_INSPECTION, SUPERVISOR_INSPECTION, CLEANING_AREA]
    QualityAuditStatus:
      type: string
      enum: [DRAFT, COMPLETED]
    QualityAuditResult:
      type: string
      enum: [PASS, FAIL, REWORK_REQUIRED]
    QualityAudit:
      type: object
      required:
        [id, clientId, buildingId, cleaningAreaId, sourceType, sourceId,
         auditorUserId, score, result, status, notes, auditedAt, createdAt,
         updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        clientId: { $ref: "#/components/schemas/Uuid" }
        buildingId: { $ref: "#/components/schemas/Uuid" }
        cleaningAreaId:
          allOf: [{ $ref: "#/components/schemas/Uuid" }]
          nullable: true
        sourceType: { $ref: "#/components/schemas/QualityAuditSourceType" }
        sourceId: { $ref: "#/components/schemas/Uuid" }
        auditorUserId: { $ref: "#/components/schemas/Uuid" }
        score: { type: number, nullable: true }
        result:
          allOf: [{ $ref: "#/components/schemas/QualityAuditResult" }]
          nullable: true
        status: { $ref: "#/components/schemas/QualityAuditStatus" }
        notes: { type: string, nullable: true }
        auditedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        cleaningArea:
          type: object
          nullable: true
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            code: { type: string }
            name: { type: string }
            status: { type: string }
    CreateQualityAuditRequest:
      type: object
      required: [sourceType, sourceId]
      properties:
        sourceType: { $ref: "#/components/schemas/QualityAuditSourceType" }
        sourceId: { $ref: "#/components/schemas/Uuid" }
        score: { type: number, minimum: 0, maximum: 100, nullable: true }
        result: { $ref: "#/components/schemas/QualityAuditResult" }
        notes: { type: string, maxLength: 1000, nullable: true }
    UpdateQualityAuditRequest:
      type: object
      properties:
        score: { type: number, minimum: 0, maximum: 100, nullable: true }
        result: { $ref: "#/components/schemas/QualityAuditResult" }
        notes: { type: string, maxLength: 1000, nullable: true }
    CompleteQualityAuditRequest:
      type: object
      required: [result]
      properties:
        result: { $ref: "#/components/schemas/QualityAuditResult" }
        score: { type: number, minimum: 0, maximum: 100, nullable: true }
        notes: { type: string, maxLength: 1000, nullable: true }

    HousekeepingFindingSourceType:
      type: string
      enum: [DAILY_CLEANING, TOILET_INSPECTION, PUBLIC_AREA_INSPECTION, SUPERVISOR_INSPECTION]
    HousekeepingFinding:
      type: object
      description: >-
        BE-11H binding. `id` is the HK link id; `findingId` is the BE-09
        Finding used for rework/verification.
      required:
        [id, clientId, buildingId, findingId, cleaningAreaId, sourceType,
         sourceId, floorId, areaId, roomId, functionalLocationId, notes,
         createdAt, updatedAt, finding]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        clientId: { $ref: "#/components/schemas/Uuid" }
        buildingId: { $ref: "#/components/schemas/Uuid" }
        findingId: { $ref: "#/components/schemas/Uuid" }
        cleaningAreaId: { $ref: "#/components/schemas/Uuid" }
        sourceType: { $ref: "#/components/schemas/HousekeepingFindingSourceType" }
        sourceId: { $ref: "#/components/schemas/Uuid" }
        floorId:
          allOf: [{ $ref: "#/components/schemas/Uuid" }]
          nullable: true
        areaId:
          allOf: [{ $ref: "#/components/schemas/Uuid" }]
          nullable: true
        roomId:
          allOf: [{ $ref: "#/components/schemas/Uuid" }]
          nullable: true
        functionalLocationId:
          allOf: [{ $ref: "#/components/schemas/Uuid" }]
          nullable: true
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finding:
          type: object
          required: [id, findingNumber, title, status, reportedByUserId, reportedAt]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            findingNumber: { type: string }
            title: { type: string }
            description: { type: string, nullable: true }
            status: { type: string }
            state: { type: string }
            reportedByUserId: { $ref: "#/components/schemas/Uuid" }
            reportedAt: { type: string, format: date-time }
        cleaningArea:
          type: object
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            code: { type: string }
            name: { type: string }
            cleaningAreaType: { type: string }
            status: { type: string }
        availableActions:
          type: array
          items: { type: string }
          description: BE-09 backend-authoritative actions for the linked finding.
    CreateHousekeepingFindingRequest:
      type: object
      required: [buildingId, cleaningAreaId, sourceType, sourceId, title]
      properties:
        buildingId: { $ref: "#/components/schemas/Uuid" }
        cleaningAreaId: { $ref: "#/components/schemas/Uuid" }
        sourceType: { $ref: "#/components/schemas/HousekeepingFindingSourceType" }
        sourceId: { $ref: "#/components/schemas/Uuid" }
        title: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 1000, nullable: true }
        findingNumber: { type: string, maxLength: 64 }
        floorId: { type: string, format: uuid, nullable: true }
        areaId: { type: string, format: uuid, nullable: true }
        roomId: { type: string, format: uuid, nullable: true }
        functionalLocationId: { type: string, format: uuid, nullable: true }
        notes: { type: string, maxLength: 1000, nullable: true }

    HousekeepingEvidenceSourceType:
      type: string
