        checklistTemplate:
          type: object
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            code: { type: string }
            name: { type: string }
            status: { type: string }
        room:
          type: object
          nullable: true
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            code: { type: string }
            name: { type: string }
        functionalLocation:
          type: object
          nullable: true
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
